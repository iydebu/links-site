<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Lilita One'; src: url(../fonts/lilita-one.woff2) format('woff2'); }
* { margin: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; background: #16122e; color: #f4f1ff; font-family: system-ui, 'Segoe UI', sans-serif;
  background-image: radial-gradient(700px 420px at 0 0, rgba(255,77,94,.3), transparent 60%), radial-gradient(700px 420px at 100% 0, rgba(61,139,255,.3), transparent 60%),
  radial-gradient(700px 420px at 100% 100%, rgba(255,207,46,.2), transparent 60%), radial-gradient(700px 420px at 0 100%, rgba(47,211,107,.22), transparent 60%);
  display: grid; grid-template-columns: 1fr 330px; gap: 50px; padding: 60px 70px; align-items: center; }
.bot { width: 120px; height: 120px; image-rendering: pixelated; border-radius: 28px; box-shadow: 0 8px 0 #b8901a; }
h1 { font: 64px/1.05 'Lilita One'; margin-top: 26px; }
p { font-size: 30px; color: #e3ddff; margin-top: 14px; }
.url { margin-top: 30px; display: inline-block; font: 30px 'Lilita One'; color: #3a2400; background: #ffcf2e; padding: 12px 26px; border-radius: 16px; box-shadow: 0 6px 0 #c98f00; }
.phone { height: 520px; border-radius: 30px; overflow: hidden; border: 6px solid #2b2357; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
.phone img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style></head>
<body>
<div>
  <img class="bot" src="../favicon.svg" alt="">
  <h1>Debu makes games.<br>Tap one and play.</h1>
  <p>LudoNow · DroneFight · Gali Gang · WhisperWriter</p>
  <div class="url">links.iydebu.com</div>
</div>
<div class="phone"><img src="../assets/ludonow-poster.jpg" alt=""></div>
</body></html>
